<style>
:root{
  --bg:#EEF1EF; --card:#FFFFFF; --ink:#12201A; --muted:#4A5852; --line:#D5DCD8; --field:#B7C2BC; --soft:#F4F6F5; --track:#DCE2DF;
  --green:#0E6B47; --green-ink:#0B5A3B; --green-soft:#DCEFE5;
  --orange:#B4400B; --orange-ink:#9A3509; --orange-soft:#FBE3D6;
  --amber:#C26A00; --amber-ink:#7A4300; --amber-soft:#FCE9C8; --amber-line:#F0D4A3;
  --red:#B42318; --red-ink:#8E1B1B; --red-soft:#FADBD8;
  --blue-ink:#2B3F8C; --blue-soft:#E1E6F5;
  --head:#12201A; --head-muted:#B9C7C0;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow','Helvetica Neue',Helvetica,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #2F7DE1;outline-offset:2px}
h1{margin:0;font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
h2{margin:0;font-size:16px;font-weight:700}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.sr{position:absolute;left:-9999px}

/* shell */
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{display:block;font-family:var(--display);font-size:24px;letter-spacing:.04em;line-height:1}
.brand span{font-size:12px;color:var(--head-muted)}
.who{display:flex;align-items:center;gap:8px;background:#23342C;border:1px solid #3B4F45;border-radius:999px;padding:4px 4px 4px 12px;min-height:40px}
.who span{font-size:13px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who button{border:0;border-radius:999px;background:#3B4F45;color:#fff;font-size:12px;font-weight:700;padding:0 10px;min-height:32px}
.banner{background:var(--amber-soft);color:var(--amber-ink);font-size:13px;font-weight:600;padding:8px 16px;border-bottom:1px solid var(--amber-line)}
main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:4px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;align-items:flex-end}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;min-height:56px;font-size:11px;font-weight:700;color:var(--muted)}
.tab.on{color:var(--green)}
.tab .fab{width:58px;height:58px;margin-top:-24px;border-radius:999px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;border:4px solid var(--bg)}

/* cards & rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cardh{display:flex;justify-content:space-between;align-items:center}
.link{min-height:36px;background:none;border:0;color:var(--green);font-weight:700;font-size:14px;padding:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #E6EBE8}
.row:last-child{border-bottom:0}
.card .row{padding:8px 0;border-bottom:0;border-top:1px solid #E6EBE8}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12px;color:var(--muted)}
.t2b{font-size:12px;color:var(--ink);font-weight:600}
.empty{font-size:14px;color:var(--muted);padding:6px 0}
.num{font-family:var(--display);font-weight:700}
.mono{font-family:var(--mono)}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tag{width:68px;flex:none;text-align:center;padding:3px 0;border-radius:6px;font-size:11px;font-weight:700}
.ok{background:var(--green-soft);color:var(--green-ink)}
.low{background:var(--amber-soft);color:var(--amber-ink)}
.outs{background:var(--red-soft);color:var(--red-ink)}
.t-in{background:var(--green-soft);color:var(--green-ink)}
.t-out{background:var(--orange-soft);color:var(--orange-ink)}
.t-adj{background:var(--blue-soft);color:var(--blue-ink)}
.c-in{color:var(--green-ink)}.c-out{color:var(--orange-ink)}.c-adj{color:var(--blue-ink)}

/* kpis */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--display);font-size:34px;line-height:1.05}
.kpi.warn{background:#FFF6E6;border-color:var(--amber-line)}.kpi.warn span,.kpi.warn b{color:var(--amber-ink)}
.kpi.good{background:#E6F3EC;border-color:#B9DCC8}.kpi.good span,.kpi.good b{color:var(--green-ink)}

/* buttons & fields */
.big{min-height:64px;border:0;border-radius:14px;color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.big.in{background:var(--green)}.big.out{background:var(--orange)}
.btn{min-height:50px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:0 16px}
.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--field)}
.btn.danger{background:var(--card);color:var(--red);border:1px solid var(--red)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn.sm{min-height:40px;font-size:13px;padding:0 12px;border-radius:10px}
.btn.wide{width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{min-height:46px;border:1px solid var(--field);border-radius:10px;padding:0 12px;font-size:16px;background:var(--card);color:var(--ink);width:100%}
select.inp{padding:0 8px}
textarea.inp{padding:10px 12px;min-height:150px;resize:vertical;line-height:1.4}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:4px;background:var(--track);padding:4px;border-radius:12px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:700}
.seg button.on-in{background:var(--green);color:#fff}
.seg button.on-out{background:var(--orange);color:#fff}
.seg button.on{background:var(--card);color:var(--green-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--field);background:var(--card);font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* scan */
.vendorbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.vendorbox select{border-width:2px;font-weight:600}
.vendorbox select.need{border-color:var(--amber)}
.vendorbox select.set{border-color:var(--green)}
.finder{position:relative;height:210px;border-radius:16px;background:#0B1410;overflow:hidden}
#reader{position:absolute;inset:0}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
#reader img,#reader__dashboard,#reader__header_message{display:none!important}
.corner{position:absolute;width:30px;height:30px;border:4px solid #fff;z-index:2}
.c1{left:24px;top:22px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.c2{right:24px;top:22px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.c3{left:24px;bottom:22px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.c4{right:24px;bottom:22px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.sweep{position:absolute;left:36px;right:36px;height:2px;background:#FF7A3D;box-shadow:0 0 12px #FF7A3D;z-index:2;animation:sweep 2.4s ease-in-out infinite;display:none}
.finder.live .sweep{display:block}
@keyframes sweep{0%{top:20%}50%{top:78%}100%{top:20%}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none;top:50%}}
.finder-ui{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#C9D6CF;font-size:13px;text-align:center;padding:0 40px}
.finder.live .finder-ui{inset:auto 0 12px 0}
.finder.live .finder-ui p{display:none}
.camBtn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #fff;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:14px}
.inrow{display:flex;gap:8px}
.inrow .inp{flex:1;min-width:0;font-family:var(--mono)}
.result{background:var(--card);border:2px solid var(--green);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.result.out{border-color:var(--orange)}
.result.new{border:2px dashed var(--orange)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.03em}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sbtn{width:56px;height:56px;border-radius:14px;border:1px solid var(--field);background:var(--soft);display:flex;align-items:center;justify-content:center}
.sbtn.plus{border:0;background:var(--green);color:#fff}
.result.out .sbtn.plus{background:var(--orange)}
.qtyin{width:110px;text-align:center;border:0;border-bottom:2px solid var(--line);background:transparent;font-family:var(--display);font-size:48px;font-weight:700;padding:0}

/* stock items */
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.itemh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bar{height:8px;border-radius:999px;background:#E3E8E5;overflow:hidden}
.bar i{display:block;height:8px;border-radius:999px}
.qbtn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--field);background:var(--card);color:var(--orange);display:flex;align-items:center;justify-content:center}
.qbtn.plus{border:0;background:var(--green);color:#fff}
.iconbtn{width:36px;height:36px;border-radius:8px;border:0;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center}
.avatar{width:36px;height:36px;flex:none;border-radius:999px;background:#E6F3EC;color:var(--green-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.countbox{background:#FFF6E6;border:1px solid var(--amber-line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.countbox label.f{color:var(--amber-ink)}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.login .brand b{font-size:40px}
.login h2{font-size:20px;margin:28px 0 12px;color:#fff}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.person{min-height:72px;border-radius:14px;border:1px solid #3B4F45;background:#1B2B23;color:#fff;text-align:left;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.person b{font-size:16px}
.person span{font-size:12px;color:var(--head-muted)}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.dots i{width:16px;height:16px;border-radius:999px;border:2px solid #B9C7C0}
.dots i.f{background:#fff;border-color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:320px;margin:0 auto;width:100%}
.pad button{min-height:64px;border-radius:14px;border:0;background:#23342C;color:#fff;font-family:var(--display);font-size:28px;font-weight:700}
.pad button.txt{font-family:var(--body);font-size:14px;background:transparent}
.loginmsg{text-align:center;min-height:20px;font-size:14px;color:#FFB59A;font-weight:600}

.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{height:38px;width:auto;flex:none}
.brand .bt{display:flex;flex-direction:column;min-width:0}
.brand .bt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.login .brand{flex-direction:column;align-items:center;text-align:center;gap:12px}
.login .brand .logo{height:96px}
.login .brand b{font-size:30px}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,32,26,.55);color:#fff;font-size:11px;font-weight:700}
.addph{aspect-ratio:1;border-radius:10px;border:2px dashed var(--field);background:var(--card);color:var(--green-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700}
.dstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dstats div{background:var(--soft);border-radius:10px;padding:8px;text-align:center}
.dstats b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.dstats span{font-size:11px;color:var(--muted);font-weight:600}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lightbox .lbbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
.gear{width:40px;height:40px;flex:none;border-radius:999px;border:1px solid #3B4F45;background:#23342C;color:#fff;display:flex;align-items:center;justify-content:center}
.gear.on{background:var(--green);border-color:var(--green)}
.topr{display:flex;align-items:center;gap:8px;flex:none}
.who span{max-width:96px}
.phbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.phbtn{min-height:52px;border-radius:12px;border:1px solid var(--field);background:var(--card);color:var(--green-ink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.phbtn.main{background:var(--green);color:#fff;border-color:var(--green)}
.daylbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 2px -4px}
.ocard{width:100%;display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.ocover{width:84px;height:84px;flex:none;border-radius:10px;overflow:hidden;background:var(--green-soft);color:var(--green-ink);display:flex;align-items:center;justify-content:center}
.ocover img{width:100%;height:100%;object-fit:cover;display:block}
.obody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.obody b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ochips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ochips span{background:var(--soft);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;color:var(--ink)}
.shooter{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.shooter video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
.shotTop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;font-size:14px;font-weight:600;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.shotBar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 18px);background:#000}
.shutter{width:76px;height:76px;border-radius:999px;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000}
.shutter:active{transform:scale(.94)}
.shotStrip{display:flex;gap:6px;min-width:88px;justify-content:flex-end}
.shotStrip img{width:40px;height:40px;object-fit:cover;border-radius:6px;border:2px solid #fff}
.shotFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.shotFlash.on{opacity:.8;transition:none}
.shotBtn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.35);color:#fff;font-weight:700;font-size:14px}
.ordercard{border:2px solid var(--green)}
.ordercard .row{align-items:center}
.fixbox{display:flex;gap:8px;align-items:flex-end;padding:8px 0 4px}
.fixbox .inp{width:110px;font-family:var(--display);font-size:22px;font-weight:700}
.pick{width:100%;background:none;border:0;border-top:1px solid #E6EBE8;text-align:left;padding:10px 0}
.packnote{background:var(--blue-soft);color:var(--blue-ink);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.total{text-align:center;font-size:14px;color:var(--muted)}
.total b{font-family:var(--display);font-size:22px;color:var(--ink)}
.subbox{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.thumb{width:44px;height:44px;flex:none;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:16px;font-family:var(--display)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.lg{width:96px;height:96px;font-size:30px;border-radius:14px}
.thumb.md{width:56px;height:56px;font-size:20px}
.imgbox{display:flex;gap:12px;align-items:center}
.imgbtns{flex:1;display:flex;flex-direction:column;gap:6px}
.imgbtns .phbtn{min-height:42px;font-size:13px}
.imgbtns .rm{min-height:32px;border:0;background:none;color:var(--red);font-weight:700;font-size:13px;align-self:flex-start;padding:0}
.ebad{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.e-x{background:#3B0D0A;color:#FFD9D4}.e-7{background:var(--red-soft);color:var(--red-ink)}.e-14{background:var(--orange-soft);color:var(--orange-ink)}.e-21{background:var(--amber-soft);color:var(--amber-ink)}.e-30{background:#FFF6CC;color:#6B5600}
.expchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.expchips button{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px}
.expchips button b{font-family:var(--display);font-size:22px;line-height:1.1}
.expchips button span{font-size:10px;font-weight:700;color:var(--muted);text-align:center}
.expchips button.on{outline:3px solid var(--ink);outline-offset:-1px}
input[type=date].inp{padding:0 10px}
.datebox{display:flex;gap:8px;align-items:flex-end}
.datebox label{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 32px));background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20;display:none}
#toast.show{display:block}
#toast.bad{background:var(--red)}
</style>

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function digits(v) { return String(v || '').replace(/\D/g, ''); }
function fmtNum(n) { return Number(n || 0).toLocaleString('en-US'); }
function fmtWhen(ts) { return new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
function startOfDay() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function isManager() { return S.me && S.me.role === 'Manager'; }
function initials(n) { return String(n).split(' ').filter(Boolean).map(function (w) { return w.charAt(0); }).join('').slice(0, 2).toUpperCase(); }
function opt(v, cur, label) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(label == null ? v : label) + '</option>'; }
function depts() { return (S.settings.depts && S.settings.depts.length) ? S.settings.depts : DEFAULT_DEPTS; }

var toastT;
function toast(msg, bad) {
  var t = $('toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, bad ? 4200 : 2600);
}

function errMsg(e) {
  var m = (e && (e.message || e.details)) || String(e);
  for (var k in ERR) { if (m.indexOf(k) >= 0) return ERR[k]; }
  if (m.indexOf('Failed to fetch') >= 0 || m.indexOf('NetworkError') >= 0) return 'No connection. Check Wi-Fi and try again.';
  return 'Could not save: ' + m;
}

function rpc(fn, args) {
  args = args || {};
  if (S.token) args.p_token = S.token;
  return sb.rpc(fn, args).then(function (r) {
    if (r.error) {
      if (String(r.error.message).indexOf('SESSION_EXPIRED') >= 0) { signOut(true); }
      throw r.error;
    }
    return r.data;
  });
}

/* ---------- data loading ---------- */
function loadUsers() {
  return sb.from('kf_users').select('id,name,role,active').eq('active', true).order('name').then(function (r) {
    if (r.error) throw r.error; S.users = r.data || [];
  });
}
function loadVendors() {

  if (channel) return;

    .on('postgres_changes', { event: '*', schema: 'public', table: 'kf_products' }, function (p) {
      if (p.eventType === 'DELETE') { if (p.old && p.old.upc) S.products.delete(p.old.upc); }
      else if (p.new && p.new.upc) { S.products.set(p.new.upc, p.new); }
      soon();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'kf_moves' }, function (p) {
      var m = p.new; if (!m) return;
      if (!S.moves.some(function (x) { return x.id === m.id; })) S.moves.unshift(m);
      if (m.type === 'in' && new Date(m.at) >= startOfDay()) S.todayIn += m.delta;
      if (S.screen === 'orders' && !S.openDel && m.delivery_id) { clearTimeout(window.__oT); window.__oT = setTimeout(function () { loadOrders().catch(function () {}); }, 1500); }
      soon();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kf_vendors' }, function () { loadVendors().then(soon); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kf_packs' }, function () { loadPacks().then(soon); })
    .subscribe(function (status) { S.live = status === 'SUBSCRIBED'; soon(); });
}

}

  var tries = [c, '0' + c, c.replace(/^0+/, '')];
  for (var i = 0; i < tries.length; i++) {
    var p = S.products.get(tries[i]); if (p) return { product: p, pack: null };
    var k = S.packs.get(tries[i]); if (k && S.products.get(k.upc)) return { product: S.products.get(k.upc), pack: k };
  }

}

  if (!delta) { S.fix = null; refresh(); return; }
  S.busy = true; refresh();
  rpc('kf_move', { p_upc: f.upc, p_delta: delta, p_type: 'in', p_reason: 'Receiving correction', p_vendor: d.vendor, p_ref: S.ref, p_absolute: null, p_delivery: d.id })
    .then(function (res) {
      if (res && res.ok === false) { toast('Cannot lower it that much: only ' + res.qty + ' on hand now.', true); return; }
      var p = S.products.get(f.upc); if (p && res) { p.qty = res.qty; }
      toast('Order corrected · ' + (g ? g.name : f.upc) + ' now ' + n);
      S.fix = null;

    .catch(function (e) { toast(errMsg(e), true); })
    .then(function () { S.busy = false; refresh(); });
}

function addPack() {
  var f = S.pform; if (!f || !f.oldUpc || S.busy) return;
  var np = f.np || {}, code = digits(np.code), size = parseInt(digits(np.size), 10) || 0;
  if (code.length < 6 || code.length > 14) { toast('Case barcodes must be 6 to 14 digits.', true); return; }
  if (size < 2) { toast('Units inside must be 2 or more.', true); return; }
  S.busy = true; refresh();
  rpc('kf_save_pack', { p_code: code, p_upc: f.oldUpc, p_size: size, p_label: np.label || 'Case' })
    .then(loadPacks).then(function () { toast((np.label || 'Case') + ' of ' + size + ' linked'); f.np = { code: '', size: '', label: 'Case' }; })
    .catch(function (e) { toast(errMsg(e), true); }).then(function () { S.busy = false; refresh(); });
}
function delPack(code) {
  if (S.confirmPack !== code) { S.confirmPack = code; refresh(); return; }
  S.confirmPack = null;
  rpc('kf_delete_pack', { p_code: code }).then(loadPacks).then(function () { toast('Case barcode removed'); })
    .catch(function (e) { toast(errMsg(e), true); }).then(refresh);
}
function doMerge() {
  var f = S.pform; if (!f || S.busy) return;
  var m = f.merge || {}, size = parseInt(digits(m.size), 10) || 0;
  if (!m.upc) { toast('Pick the single item to merge into.', true); return; }
  if (size < 2) { toast('Units inside must be 2 or more.', true); return; }
  if (S.confirmDel !== 'merge') { S.confirmDel = 'merge'; refresh(); return; }
  S.busy = true; S.confirmDel = false; refresh();
  var target = S.products.get(m.upc);
  rpc('kf_merge_pack', { p_case_upc: f.oldUpc, p_base_upc: m.upc, p_size: size, p_label: m.label || 'Case' })
    .then(function (r) { return Promise.all([loadProducts(), loadPacks()]).then(function () { return r; }); })
    .then(function (r) { toast('Merged into ' + (target ? target.name : 'the single item') + (r && r.units_added ? ' · +' + fmtNum(r.units_added) + ' units' : '')); S.pform = null; })

    case 'start': S.mode = d.mode; go('scan'); break;
    case 'mode': S.mode = d.mode; refresh(); break;
    case 'cam': if (cam) stopCam(); else startCam(); break;
    case 'lookup': lookup(($('code') || {}).value); break;
    case 'qty': S.qty = Math.max(1, (parseInt(S.qty, 10) || 0) + parseInt(d.n, 10)); var rr = $('f-result'); if (rr) rr.innerHTML = resultHtml(); break;
    case 'cancelScan': clearDraftImage(); S.expIn = ''; S.scanned = null; S.code = ''; S.qty = 1; var ci = $('code'); if (ci) ci.value = ''; refresh(); break;
    case 'confirm': confirmMove(); break;
    case 'createReceive': createReceive(); break;
    case 'dept': S.dept = d.v; refresh(); break;
    case 'quick': quick(d.upc, parseInt(d.n, 10)); break;
    case 'editProduct': openProduct(d.upc); break;
    case 'newProduct': openProduct(null); break;
    case 'saveProduct': saveProduct(); break;
    case 'deleteProduct': deleteProduct(); break;
    case 'ptab': S.panelTab = d.v; S.pform = S.vform = S.uform = null; S.setForm = null; S.confirmDel = false; if (d.v === 'users') loadUsers().then(soon); refresh(); break;
    case 'closeForm': clearDraftImage(); S.pform = S.vform = S.uform = null; S.confirmDel = false; refresh(); break;
    case 'newVendor': S.vform = { id: null, name: '', contact: '', phone: '', days: '' }; S.confirmDel = false; refresh(); break;
    case 'editVendor': var v = S.vendors.filter(function (x) { return x.id === d.id; })[0]; if (v) { S.vform = { id: v.id, name: v.name, contact: v.contact, phone: v.phone, days: v.days }; S.confirmDel = false; refresh(); } break;
    case 'saveVendor': saveVendor(); break;
    case 'deleteVendor': deleteVendor(); break;
    case 'newUser': S.uform = { id: null, name: '', role: 'Receiver', pin: '' }; S.confirmDel = false; refresh(); break;
    case 'editUser': var u = S.users.filter(function (x) { return x.id === d.id; })[0]; if (u) { S.uform = { id: u.id, name: u.name, role: u.role, pin: '' }; S.confirmDel = false; refresh(); } break;
    case 'saveUser': saveUser(); break;
    case 'deleteUser': deleteUser(); break;
    case 'saveSettings': saveSettings(); break;
    case 'logf': S.logFilter = d.v; refresh(); break;
    case 'moreLog': loadMoves(true).then(refresh).catch(function (er) { toast(errMsg(er), true); }); break;
    case 'exportInv': exportInv(); break;
    case 'exportLog': exportLog(); break;
    case 'importCsv': $('csvFile').click(); break;
    case 'addPhoto': if (!S.vendor) { toast('Select the vendor for this delivery first.', true); break; } S.pickTarget = null; $('photoFile').click(); break;
    case 'finishDelivery': finishDelivery(); break;
    case 'viewLocal': var lp = S.photosLocal[parseInt(d.i, 10)]; if (lp) { S.lightbox = { url: lp.url || lp.thumb, id: lp.id || null, local: true }; S.confirmDel = false; refresh(); } break;
    case 'shoot': openShooter(null); break;
    case 'shootOrder': if (S.openDel) openShooter(S.openDel.d.id); break;
    case 'galleryOrder': if (S.openDel) { S.pickTarget = S.openDel.d.id; $('photoFile').click(); } break;
    case 'shotTake': takeShot(); break;
    case 'shotClose': closeShooter(); break;
    case 'shotTorch': toggleTorch(); break;
    case 'exportOrder': exportOrder(); break;
    case 'resumeOrder': resumeOrder(); break;
    case 'imgShoot': openShooter(null, 'product', d.ctx); break;
    case 'imgPick': S.pickTarget = { kind: 'product', ctx: d.ctx }; $('photoFile').click(); break;
    case 'imgRemove':
      if (d.ctx === 'edit' && S.pform && S.pform.oldUpc) {
        var ru = S.pform.oldUpc;
        photoApi({ action: 'product_image_delete', upc: ru }).then(function () { var rp = S.products.get(ru); if (rp) rp.image_url = ''; toast('Photo removed'); refresh(); }).catch(function (er) { toast(errMsg(er), true); });
      } else { clearDraftImage(); refresh(); var rz2 = $('f-result'); if (rz2 && S.screen === 'scan') rz2.innerHTML = resultHtml(); }
      break;
    case 'clearDate': setPath(d.bind, ''); refresh(); var rz3 = $('f-result'); if (rz3 && S.screen === 'scan') rz3.innerHTML = resultHtml(); break;
    case 'expf': S.expFilter = S.expFilter === d.v ? 'all' : d.v; refresh(); break;
    case 'recvAs': if (S.scanned) { S.scanned.as = d.v; S.qty = 1; fill('f-result', resultHtml()); } break;
    case 'newKind': S.newP.kind = d.v; S.qty = 1; fill('f-result', resultHtml()); break;
    case 'newLink': S.newP.link = d.v; S.newP.linkUpc = ''; fill('f-result', resultHtml()); break;
    case 'linkPick': S.newP.linkUpc = d.upc; fill('f-result', resultHtml()); break;
    case 'linkClear': S.newP.linkUpc = ''; S.newP.linkQ = ''; fill('f-result', resultHtml()); break;
    case 'addPack': addPack(); break;
    case 'delPack': delPack(d.code); break;
    case 'mergeOpen': if (S.pform) { S.pform.mergeOpen = true; S.pform.merge = { q: '', upc: '', size: '', label: 'Case' }; refresh(); } break;
    case 'mergePick': if (S.pform && S.pform.merge) { S.pform.merge.upc = d.upc; refresh(); } break;
    case 'mergeClear': if (S.pform && S.pform.merge) { S.pform.merge.upc = ''; S.confirmDel = false; refresh(); } break;
    case 'doMerge': doMerge(); break;
    case 'focusScan': S.manual = false; refresh(); var fz = $('finder'); if (fz && fz.scrollIntoView) fz.scrollIntoView({ behavior: 'smooth', block: 'start' }); var cz = $('code'); if (cz) cz.focus(); break;
    case 'manualToggle': S.manual = !S.manual; S.manualQ = ''; refresh(); if (S.manual) { var mq = $('manualQ'); if (mq) mq.focus(); } break;
    case 'manualPick': S.scanned = { upc: d.upc, code: d.upc, as: 'unit' }; S.qty = 1; S.manual = false; refresh(); var rz = $('f-result'); if (rz && rz.scrollIntoView) rz.scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
    case 'manualNew': S.scanned = { upc: null, code: '', manual: true }; S.qty = 1; S.newP = newPDefaults(); S.newP.name = S.manualQ.trim(); S.manual = false; refresh(); var rn = $('f-result'); if (rn && rn.scrollIntoView) rn.scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
    case 'fixLine': var gx = orderGroups().filter(function (x) { return x.upc === d.upc; })[0]; S.fix = { upc: d.upc, val: String(gx ? gx.units : 0) }; refresh(); break;
    case 'saveFix': saveFix(); break;
    case 'cancelFix': S.fix = null; refresh(); break;
    case 'openDel': openDelivery(d.id); break;
    case 'closeDel': S.openDel = null; refresh(); break;
    case 'viewPhoto': var vp = S.openDel && S.openDel.photos && S.openDel.photos[parseInt(d.i, 10)]; if (vp) { S.lightbox = { url: vp.url, id: vp.id }; S.confirmDel = false; refresh(); } break;
    case 'closeLb': S.lightbox = null; S.confirmDel = false; refresh(); break;
    case 'delPhoto':
      if (!S.lightbox || !S.lightbox.id) break;
      if (!S.confirmDel) { S.confirmDel = true; refresh(); break; }
      var pid = S.lightbox.id;
      photoApi({ action: 'delete', photo_id: pid }).then(function () {
        S.lightbox = null; S.confirmDel = false;
        if (S.openDel && S.openDel.photos) S.openDel.photos = S.openDel.photos.filter(function (x) { return x.id !== pid; });
        S.photosLocal = S.photosLocal.filter(function (x) { return x.id !== pid; });
        toast('Photo deleted'); refresh();
      }).catch(function (er) { toast(errMsg(er), true); });
      break;
  }
  // panel forms swap the whole body; make sure it redraws even if a field had focus
  if (['closeForm', 'newVendor', 'editVendor', 'newUser', 'editUser', 'ptab', 'newProduct', 'editProduct'].indexOf(a) >= 0) { var pb = $('f-pbody'); if (pb) pb.innerHTML = panelBody(); fill('f-ptabs', panelTabs()); }
});

function setPath(path, value) {
  var parts = path.split('.');
  if (parts.length === 1) { S[path] = value; return; }
  if (parts.length === 3) {
    var o = S[parts[0]]; if (!o) return;
    o[parts[1]] = o[parts[1]] || {}; o[parts[1]][parts[2]] = value; return;
  }
  if (S[parts[0]]) S[parts[0]][parts[1]] = value;
}
document.addEventListener('input', function (e) {
  var el = e.target, k = el.getAttribute && el.getAttribute('data-bind'); if (!k) return;
  setPath(k, el.value);
  if (k === 'search') { fill('f-stocksum', stockSum()); var st = $('f-stock'); if (st) st.innerHTML = stockHtml(); }
  if (k === 'adminQ') { var q = S.adminQ.trim().toLowerCase(); var al = $('f-adminlist'); if (al) al.innerHTML = adminRows(productList().filter(function (p) { return !q || (p.name + ' ' + p.upc).toLowerCase().indexOf(q) >= 0; })); }
  if (k === 'qty') { var n = parseInt(digits(el.value), 10); S.qty = isNaN(n) ? '' : n; }
  if (k === 'newP.linkQ') { var lr = $('f-link'); if (lr) lr.innerHTML = linkResults(); }
  if (k === 'newP.packSize') { var tot = document.querySelector('#f-result .total'); var sz = parseInt(digits(el.value), 10) || 0, qq = parseInt(S.qty, 10) || 0; if (tot) tot.innerHTML = sz > 1 ? qq + ' × ' + sz + ' = <b>' + fmtNum(qq * sz) + '</b> units' : 'Enter the units inside to see the total.'; }
  if (k === 'pform.merge.q') { var mq = S.pform && S.pform.merge ? S.pform.merge.q.trim().toLowerCase() : ''; var mr2 = $('f-merge'); if (mr2) mr2.innerHTML = mq ? productList().filter(function (p) { return p.upc !== S.pform.oldUpc && searchText(p).toLowerCase().indexOf(mq) >= 0; }).slice(0, 6).map(function (p) { return '<button type="button" class="pick" data-act="mergePick" data-upc="' + esc(p.upc) + '"><span class="t1" style="display:block">' + esc(p.name) + '</span><span class="t2 mono">' + esc(p.upc) + '</span></button>'; }).join('') : ''; }
  if (k === 'qty' && S.scanned) { var tq = document.querySelector('#f-result .total'); if (tq) { var n2 = parseInt(digits(el.value), 10) || 0, k2 = S.scanned.as && S.scanned.as !== 'unit' ? S.packs.get(S.scanned.as) : null, sz2 = k2 ? k2.size : parseInt(digits(S.newP.packSize), 10) || 0; if (sz2 > 1) tq.innerHTML = (k2 ? 'Total: ' : n2 + ' × ' + sz2 + ' = ') + '<b>' + fmtNum(n2 * sz2) + '</b> units'; } }
  if (k === 'manualQ') { var mr = $('f-manual'); if (mr) mr.innerHTML = manualResults(); }
  if (k === 'ordersQ') { var of = $('f-orders'); if (of) of.innerHTML = ordersHtml(); }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.id === 'photoFile') {
    var pt = S.pickTarget; S.pickTarget = null;
    if (el.files && el.files.length) {
      if (pt && pt.kind === 'product') compressPhoto(el.files[0], 600).then(function (b) { onProductImage(b, pt.ctx); }).catch(function (er) { toast(errMsg(er), true); });
      else addPhotos(el.files, pt);
    }
    el.value = ''; return;
  }
  if (el.id === 'csvFile') { if (el.files && el.files[0]) importCsv(el.files[0]); el.value = ''; return; }
  var k = el.getAttribute && el.getAttribute('data-bind'); if (!k) return;
  setPath(k, el.value);
  if (k === 'vendor') { el.className = 'inp ' + (S.vendor ? 'set' : 'need'); el.blur(); fill('f-vendor', vendorHtml()); if (S.delivery && S.delivery.vendor !== S.vendor) { S.orderMoves = []; S.fix = null; } fill('f-order', orderHtml()); }
  if ((k === 'expIn' || k === 'newP.exp') && S.screen === 'scan') { el.blur(); var rd = $('f-result'); if (rd) rd.innerHTML = resultHtml(); }
  if (k === 'pform.exp') { el.blur(); refresh(); }
  if (k === 'newP.unit' || k === 'newP.packLabel') { el.blur(); fill('f-result', resultHtml()); }
  if (k === 'qty') { if (!S.qty || S.qty < 1) S.qty = 1; el.value = S.qty; }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('shooter')) { closeShooter(); return; }
  if (e.key === 'Escape' && S.lightbox) { S.lightbox = null; refresh(); return; }
  if (e.target && e.target.id === 'code' && e.key === 'Enter') { e.preventDefault(); lookup(e.target.value); }
});

// Bluetooth / USB scanners type fast and end with Enter. Catch them anywhere on the Scan screen.
var wedge = '', wedgeT = 0;
document.addEventListener('keydown', function (e) {
  if (!S.me || isField(document.activeElement)) return;
  if (e.key >= '0' && e.key <= '9') {
    var now = Date.now(); if (now - wedgeT > 80) wedge = ''; wedgeT = now; wedge += e.key; return;
  }
  if (e.key === 'Enter' && wedge.length >= 6 && Date.now() - wedgeT < 120) {
    var c = wedge; wedge = '';
    if (S.screen !== 'scan') { go('scan'); }
    lookup(c);
  }
});

/* ---------- boot ---------- */
(function boot() {
  var saved = null; try { saved = localStorage.getItem('kf_token'); } catch (e) {}
  renderAll();
  loadSettings().catch(function () {}).then(function () {
    if (!saved) return loadUsers().then(renderAll);
    return sb.rpc('kf_session', { p_token: saved }).then(function (r) {
      if (r.error || !r.data) { try { localStorage.removeItem('kf_token'); } catch (e) {} return loadUsers().then(renderAll); }
      S.token = saved; S.me = r.data; renderAll();
      return loadAll().then(function () { subscribe(); renderAll(); });
    });
  }).catch(function (e) { S.loginMsg = errMsg(e); renderAll(); });
})();

})();
</script>
</body>
